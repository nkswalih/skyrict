[project]
name = "skyrict"
version = "0.1.0"
description = "AI-native business operations platform with integrated market intelligence"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Skyrict Contributors" },
]

[tool.uv.workspace]
members = ["services/*", "libs/*"]
exclude = ["services/_template"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4.0,<5",
    "flake8>=7.0,<8",
    "black>=24.0,<25",
    "isort>=6.0,<10",
    "bandit>=1.7,<2",
    "testcontainers[postgres]>=4.0,<5",
    "types-python-jose>=3.3,<4",
    "types-Pillow>=10.2.0.20240822,<11",
    "import-linter>=2.0,<3",
]

# ---------- Ruff (root-level defaults) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["services/_template"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",   # FastAPI dependency-injection idiom (B008)
    "fastapi.Query",     # FastAPI query-parameter idiom (B008)
    "fastapi.Body",      # FastAPI body-parameter idiom (B008)
]

# Imported names are resolved at runtime (pydantic/SQLAlchemy model fields,
# FastAPI signature introspection), so they must stay importable at runtime.
[tool.ruff.lint.per-file-ignores]
"services/identity/src/identity/api/**" = ["TC001", "TC002", "TC003"]
"services/identity/src/identity/features/**" = ["TC001", "TC002", "TC003"]
"services/identity/src/identity/**/models/**" = ["TC001", "TC002", "TC003"]
"services/identity/src/identity/core/exceptions.py" = ["TC001", "TC002", "TC003"]
"services/identity/src/identity/core/tenant_context.py" = ["TC001", "TC002", "TC003"]
"services/core/src/core/api/**" = ["TC001", "TC002", "TC003"]
"services/core/src/core/features/**" = ["TC001", "TC002", "TC003"]
"services/core/src/core/**/models/**" = ["TC001", "TC002", "TC003"]
"services/core/src/core/core/exceptions.py" = ["TC001", "TC002", "TC003"]
"services/core/src/core/core/tenant_context.py" = ["TC001", "TC002", "TC003"]
"services/ai-agent/src/ai_agent/api/**" = ["TC001", "TC002", "TC003"]
"services/ai-agent/src/ai_agent/models/**" = ["TC001", "TC002", "TC003"]
"services/ai-agent/src/ai_agent/core/exceptions.py" = ["TC001", "TC002", "TC003"]
"services/ai-agent/src/ai_agent/core/tenant_context.py" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["skyrict", "identity", "core", "ai_agent", "skyrict_common", "skyrict_testing", "skyrict_events"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------- Black (local formatting, CI uses ruff format) ----------
[tool.black]
line-length = 100
target-version = ["py312"]

# ---------- isort (local import sorting, CI uses ruff I rule) ----------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["skyrict", "identity", "core", "ai_agent", "skyrict_common", "skyrict_testing", "skyrict_events"]

# ---------- Bandit (security scanner for CI) ----------
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git", ".venvs", "**/__pycache__", "services/_template"]
skips = [
    "B101",
    "B104",  # 0.0.0.0 bind host in dev CLI serve command
    "B105",  # token-type constants ("access"/"refresh") flagged as passwords
    "B110",  # intentional suppression of invalid-token errors in middleware
    "B311",
    "B403",
    "B404",
    "B603",
    "B607",  # "uv" binary invoked via PATH in CLI migrate/seed commands
]

# ---------- Import Linter (enforced architecture) ----------
[tool.importlinter]
root_package = "identity"
include_external_packages = false
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Feature packages are independent"
type = "independence"
modules = [
    "identity.features.auth",
    "identity.features.users",
    "identity.features.organizations",
    "identity.features.sessions",
    "identity.features.mfa",
    "identity.features.passkeys",
    "identity.features.sso",
    "identity.features.roles",
    "identity.features.audit",
]
# Legitimate exceptions, ignored so the contract protects real coupling:
# 1. Every feature router consumes the api composition root (get_current_user,
#    get_db, service factories). api.deps is the sole wiring point; features
#    never import one another's services directly.
# 2. The auth feature embeds the user profile in its response schema - a pure
#    pydantic model cross-reference (data contract), not a behavioral coupling.
ignore_imports = [
    "identity.features.**.router -> identity.api.deps",
    "identity.features.auth.schemas -> identity.features.users.schemas",
]

[[tool.importlinter.contracts]]
name = "Foundations never depend on features or api"
type = "forbidden"
source_modules = [
    "identity.core",
    "identity.db",
    "identity.models",
    "identity.domain",
    "identity.events",
]
forbidden_modules = ["identity.features", "identity.api"]

[[tool.importlinter.contracts]]
name = "Only repositories touch the database layer"
type = "forbidden"
source_modules = ["identity.features"]
forbidden_modules = ["identity.models", "identity.db"]
# Repositories are the ORM gateway: services/routers/schemas must never import
# SQLAlchemy models or the db layer directly. Persistence stays in repository.py.
# Direct-import only: the sanctioned api.deps composition-root chain is not a
# feature->db coupling, so indirect chains through it are not flagged.
allow_indirect_imports = true
ignore_imports = [
    "identity.features.**.repository -> identity.models.**",
    "identity.features.**.repository -> identity.db.**",
    "identity.features.invitations.service -> identity.db.session",
]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["identity.domain"]
forbidden_modules = ["identity.models", "identity.db", "identity.features", "identity.api"]

[[tool.importlinter.contracts]]
name = "API never touches ORM models"
type = "forbidden"
source_modules = ["identity.api"]
forbidden_modules = ["identity.models"]
# Direct-import only: api.deps legitimately wires repositories (which touch
# models) as the composition root, so indirect chains are not flagged.
allow_indirect_imports = true

# ---------- Mypy (root-level defaults) ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
exclude = ['services/_template/', '(^|/)tests/']

[[tool.mypy.overrides]]
# Third-party packages without type stubs - treat as Any.
module = [
    "typer",
    "kafka",
    "user_agents",
    "geoip2",
    "maxminddb",
    "boto3",
    "yaml",
    "apscheduler",
    "apscheduler.schedulers.asyncio",
    "apscheduler.triggers.cron",
    "tzlocal",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ragas is an optional, lazily-imported eval dependency (nightly workflow
# installs it with `uv run --with`); treat as Any like the other untyped deps.
module = ["ragas", "ragas.metrics"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# scikit-learn, shap and numba ship no type stubs (ai-agent HR attrition model).
module = ["shap", "sklearn", "sklearn.*", "numba", "numba.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# reportlab ships no type stubs (payslip PDF renderer) — treat as Any.
module = ["reportlab", "reportlab.lib.*", "reportlab.platypus.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy ships py.typed but is only partially typed — treat as Any.
# factory_boy ships py.typed but is only partially typed - treat as Any.
module = ["factory"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# Factories subclass factory_boy's Any-typed Factory base class.
module = ["skyrict_testing.factories"]
disallow_subclassing_any = false
