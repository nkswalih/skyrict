[project]
name = "skyrict"
version = "0.1.0"
description = "AI-native business operations platform with integrated market intelligence"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Skyrict Contributors" },
]

[tool.uv.workspace]
members = ["services/*", "libs/*"]
exclude = ["services/_template"]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6.0,<7",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
    "pre-commit>=4.0,<5",
    "flake8>=7.0,<8",
    "black>=24.0,<25",
    "isort>=6.0,<7",
    "bandit>=1.7,<2",
    "testcontainers[postgres]>=4.0,<5",
]

# ---------- Ruff (root-level defaults) ----------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line length (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["skyrict", "identity", "skyrict_common", "skyrict_testing", "skyrict_events"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ---------- Black (local formatting, CI uses ruff format) ----------
[tool.black]
line-length = 100
target-version = ["py312"]

# ---------- isort (local import sorting, CI uses ruff I rule) ----------
[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["skyrict", "identity", "skyrict_common", "skyrict_testing", "skyrict_events"]

# ---------- Bandit (security scanner for CI) ----------
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git", ".venvs", "**/__pycache__"]
skips = ["B101", "B311", "B403", "B404", "B603"]

# ---------- Mypy (root-level defaults) ----------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true
