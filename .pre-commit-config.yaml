# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  # ---------- General file checks ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  # ---------- Secret scanning: gitleaks ----------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ---------- Python: isort (import sorting) ----------
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black", "--line-length", "100"]
        types_or: [python, pyi]

  # ---------- Python: Black (code formatter) ----------
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 24.10.0
    hooks:
      - id: black
        args: ["--line-length", "100", "--target-version", "py312"]
        types_or: [python, pyi]

  # ---------- Python: Ruff linter ----------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
        types_or: [python, pyi, jupyter]

  # ---------- Python: Ruff formatter ----------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  # ---------- Python: Flake8 (basic style lint) ----------
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--config=.flake8"]
        types_or: [python, pyi]

  # ---------- Python: Mypy (per-service) ----------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings]
        args: ["--config-file=pyproject.toml"]
        pass_filenames: false
        entry: mypy services/identity/src/ libs/skyrict-common/src/ libs/skyrict-events/src/ libs/skyrict-testing/src/

  # ---------- Node.js / TypeScript: pnpm lint + format ----------
  - repo: local
    hooks:
      - id: pnpm-lint
        name: pnpm lint (eslint)
        entry: bash -c 'if [ -f pnpm-lock.yaml ]; then pnpm run lint; fi'
        language: system
        files: \.(ts|tsx|js|jsx)$
        pass_filenames: false
      - id: pnpm-format
        name: pnpm format (prettier)
        entry: bash -c 'if [ -f pnpm-lock.yaml ]; then pnpm run format; fi'
        language: system
        files: \.(ts|tsx|js|jsx|css|json|md)$
        pass_filenames: false
      - id: pnpm-typecheck
        name: pnpm typecheck
        entry: bash -c 'if [ -f pnpm-lock.yaml ]; then pnpm run typecheck; fi'
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  # ---------- Commit message format ----------
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.4.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
