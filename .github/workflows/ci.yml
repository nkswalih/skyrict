name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
      core: ${{ steps.filter.outputs.core }}
      common: ${{ steps.filter.outputs.common }}
      events: ${{ steps.filter.outputs.events }}
      testing: ${{ steps.filter.outputs.testing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            identity:
              - 'services/identity/**'
            core:
              - 'services/core/**'
            common:
              - 'libs/skyrict-common/**'
            events:
              - 'libs/skyrict-events/**'
            testing:
              - 'libs/skyrict-testing/**'

  lint:
    name: Lint & Typecheck & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - run: uv sync --all-packages --group dev
      - name: Ruff lint
        run: uv run ruff check services/ libs/
      - name: Ruff format check
        run: uv run ruff format --check services/ libs/
      - name: Mypy typecheck
        run: uv run mypy services/ libs/
      - name: Bandit security scan
        run: uv run bandit -r services/ libs/ -c pyproject.toml

  test:
    name: Tests (${{ matrix.package }})
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: services/identity
            flag: identity
          - package: services/core
            flag: core
          - package: libs/skyrict-common
            flag: common
          - package: libs/skyrict-events
            flag: events
          - package: libs/skyrict-testing
            flag: testing
    if: ${{ fromJSON(needs.changes.outputs[matrix.flag]) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - run: uv sync --all-packages --group dev
      - name: Run tests
        run: uv run pytest ${{ matrix.package }}/tests/ -v --tb=short
