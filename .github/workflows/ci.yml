name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: Detect changed packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      identity: ${{ steps.filter.outputs.identity }}
      core: ${{ steps.filter.outputs.core }}
      common: ${{ steps.filter.outputs.common }}
      events: ${{ steps.filter.outputs.events }}
      testing: ${{ steps.filter.outputs.testing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            identity:
              - 'services/identity/**'
            core:
              - 'services/core/**'
            common:
              - 'libs/skyrict-common/**'
            events:
              - 'libs/skyrict-events/**'
            testing:
              - 'libs/skyrict-testing/**'
            fabric:
              - 'libs/skyrict-fabric/**'

  lint:
    name: Lint & Typecheck & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --all-packages --group dev
      - name: Ruff lint
        run: uv run ruff check services/ libs/
      - name: Ruff format check
        run: uv run ruff format --check services/ libs/
      - name: Mypy typecheck
        run: uv run mypy services/ libs/
      - name: Bandit security scan
        run: uv run bandit -r services/ libs/ -c pyproject.toml

  test-identity:
    name: Tests (services/identity)
    needs: changes
    if: ${{ needs.changes.outputs.identity == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --all-packages --group dev
      - name: Run tests
        run: uv run pytest services/identity/tests/ -v --tb=short

  test-core:
    name: Tests (services/core)
    needs: changes
    if: ${{ needs.changes.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skyrict
          POSTGRES_PASSWORD: skyrict
          POSTGRES_DB: skyrict_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyrict -d skyrict_identity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CORE_DATABASE_URL: postgresql+asyncpg://skyrict:skyrict@localhost:5432/skyrict_identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --all-packages --group dev
      - name: Run tests
        run: uv run pytest services/core/tests/ -v --tb=short

  test-common:
    name: Tests (libs/skyrict-common)
    needs: changes
    if: ${{ needs.changes.outputs.common == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --all-packages --group dev
      - name: Run tests
        run: uv run pytest libs/skyrict-common/tests/ -v --tb=short

  test-events:
    name: Tests (libs/skyrict-events)
    needs: changes
    if: ${{ needs.changes.outputs.events == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --all-packages --group dev
      - name: Run tests
        run: uv run pytest libs/skyrict-events/tests/ -v --tb=short

  test-testing:
    name: Tests (libs/skyrict-testing)
    needs: changes
    if: ${{ needs.changes.outputs.testing == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --all-packages --group dev
      - name: Run tests
        run: uv run pytest libs/skyrict-testing/tests/ -v --tb=short

  test-fabric:
    name: Tests (libs/skyrict-fabric)
    needs: changes
    if: ${{ needs.changes.outputs.fabric == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --all-packages --group dev
      - name: Run tests
        run: uv run pytest libs/skyrict-fabric/tests/ -v --tb=short
