name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint & Typecheck & Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --group dev
      - name: Ruff lint
        run: uv run ruff check services/ libs/
      - name: Ruff format check
        run: uv run ruff format --check services/ libs/
      - name: Mypy typecheck
        run: uv run mypy services/ libs/
      - name: Bandit security scan
        run: uv run bandit -r services/ libs/ -c pyproject.toml

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - services/identity
          - libs/skyrict-common
          - libs/skyrict-events
          - libs/skyrict-testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
        with:
          version: latest
      - run: uv sync --group dev
      - name: Run tests
        run: uv run pytest ${{ matrix.package }}/tests/ -v --tb=short
