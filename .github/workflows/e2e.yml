# =============================================================================
# CI - End-to-End Tests (SKY-103)
#
# Boots the full compose cluster (Postgres, Redis, Mailpit, Identity, Core,
# AI-Agent, Nginx), seeds the databases, builds the web app, starts Next.js
# on the host at :3100, and runs Playwright against the nginx origin
# (http://default.localhost:3000 -> Next.js).
#
# Next.js runs on the host (not inside a container) so Playwright can reach
# it via host.docker.internal and so `next start` binds 127.0.0.1:3100.
# =============================================================================

name: E2E Tests

on:
  push:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - "services/**"
      - "infra/**"
      - "scripts/e2e/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/web/**"
      - "services/**"
      - "infra/**"
      - "scripts/e2e/**"
      - ".github/workflows/e2e.yml"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.7"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- JWT RSA keys ----------------------------------------------------
      - name: Generate JWT RSA keys
        run: |
          mkdir -p .dev/keys
          openssl genrsa -out .dev/keys/private.pem 2048 2>/dev/null
          openssl rsa -in .dev/keys/private.pem -pubout -out .dev/keys/public.pem 2>/dev/null
          echo "Generated .dev/keys/private.pem + public.pem"

      # ---- MFA encryption key (SEC-CLEAN-001) ------------------------------
      # The compose stack requires IDENTITY_MFA_ENCRYPTION_KEY with no committed
      # fallback. Generate one fresh Fernet key per run; a single job-level
      # value keeps every identity replica able to decrypt the same TOTP secrets.
      - name: Generate MFA encryption key
        run: echo "IDENTITY_MFA_ENCRYPTION_KEY=$(python3 -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())')" >> "$GITHUB_ENV"

      # ---- Compose up ------------------------------------------------------
      - name: Start compose stack
        run: docker compose -f infra/docker/docker-compose.e2e.yml up -d --build
        timeout-minutes: 15
        env:
          # Semantic inventory search (SKY-70): forwards the repo-level
          # embedding secrets into the ai-agent container via compose
          # interpolation. When the secrets are unset (empty), the ai-agent
          # boots with embeddings disabled and search degrades to exact-only.
          AI_EMBEDDING_PROVIDER: ${{ secrets.AI_EMBEDDING_PROVIDER }}
          AI_EMBEDDING_API_KEY: ${{ secrets.AI_EMBEDDING_API_KEY }}

      # ---- Seeds -----------------------------------------------------------
      - name: Wait for identity and seed database
        run: |
          for i in $(seq 1 60); do
            if docker compose -f infra/docker/docker-compose.e2e.yml exec -T identity \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" \
              2>/dev/null; then
              break
            fi
            echo "Waiting for identity... ($i/60)"
            sleep 2
          done

          # Identity seed is idempotent: creates the default tenant + admin
          # user on first run and no-ops on re-runs.  --workdir is REQUIRED:
          # the image WORKDIR is /app, and Settings resolves the relative
          # .dev/keys/*.pem paths against the process CWD — the seed must
          # run from /app/services/identity exactly like the container boot
          # command does (uv run --directory services/identity ...). PYTHONPATH
          # is set in the container env and /app/.venv/bin is on PATH, so
          # plain `python` resolves both the src-layout packages and deps.
          docker compose -f infra/docker/docker-compose.e2e.yml exec -T \
            --workdir /app/services/identity identity \
            python -m identity.seed
          echo "Seeded identity (default tenant + admin@skyrict.io)"

          for i in $(seq 1 60); do
            if docker compose -f infra/docker/docker-compose.e2e.yml exec -T core \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')" \
              2>/dev/null; then
              break
            fi
            echo "Waiting for core... ($i/60)"
            sleep 2
          done

          # Core seed populates the report catalog, leave-type catalogue,
          # roles, approvals, and finance chart for the default tenant.
          # Invoked through the typer CLI (core.cli): `python -m core.seed`
          # has no __main__ and is a silent no-op, which left erp_leave_types
          # empty until the payroll hire's accrual FK-violated (500).
          # The tenant UUID is the identity service's DEFAULT_TENANT_ID.
          # --workdir: same CWD rationale as the identity seed above.
          docker compose -f infra/docker/docker-compose.e2e.yml exec -T \
            --workdir /app/services/core core \
            python -m core.cli seed \
            --tenant-id 00000000-0000-0000-0000-000000000001
          echo "Seeded core report catalog + HR/Payroll defaults"
        timeout-minutes: 10

      # ---- Enable the journal-entry approval engine ------------------------
      # SKY-92: the engine is OFF by default so existing ERP flows are
      # unchanged. The approval-interrupt AI journey opts this disposable
      # tenant in; journal entries below the seeded 10,000 threshold still
      # auto-approve, so every other finance journey is unaffected.
      - name: Enable journal-entry approval engine
        run: |
          docker compose -f infra/docker/docker-compose.e2e.yml exec -T \
            -e PGPASSWORD=skyrict postgres \
            psql -U skyrict -d skyrict_identity -v ON_ERROR_STOP=1 -c "
              INSERT INTO erp_tenant_settings (tenant_id, id, key, value)
              SELECT '00000000-0000-0000-0000-000000000001', gen_random_uuid(), flag_key, 'true'
              FROM (VALUES ('approval_engine_enabled'), ('je_approval_engine')) AS flags(flag_key)
              WHERE NOT EXISTS (
                SELECT 1 FROM erp_tenant_settings s
                WHERE s.tenant_id = '00000000-0000-0000-0000-000000000001' AND s.key = flags.flag_key
              );
            "
          echo "Enabled approval_engine_enabled + je_approval_engine for default tenant"

      # ---- Build + start Next.js -------------------------------------------
      - name: Build web app
        run: pnpm --filter @skyrict/web build
        env:
          SESSION_COOKIE_SECURE: "false"

      - name: Start Next.js (production mode)
        # `next start` honors $PORT (set below), so we must NOT pass a
        # `-- -p 3100` arg through pnpm: pnpm appends the literal `--` to the
        # script argv, `next start` then treats `-p` as a positional project
        # directory and exits with "Invalid project directory provided".
        #
        # The probe hits /api/v1/health, a static Next route that answers 200
        # without touching a backend or requiring a session cookie. If it ever
        # fails again, fail fast with the server log + last response body so
        # the cause (404/500, rebind, process exit) is obvious instead of a
        # silent 90s timeout.
        run: |
          set -o pipefail

          pnpm --filter @skyrict/web start > /tmp/next.log 2>&1 &
          NEXT_PID=$!

          for i in $(seq 1 90); do
            if ! kill -0 "$NEXT_PID" 2>/dev/null; then
              echo "Next.js exited unexpectedly" >&2
              cat /tmp/next.log >&2
              exit 1
            fi

            status=$(curl -sS -o /tmp/health-response \
              -w "%{http_code}" \
              http://127.0.0.1:3100/api/v1/health || true)

            if [ "$status" = "200" ]; then
              echo "HEALTHY http://127.0.0.1:3100/api/v1/health"
              exit 0
            fi

            echo "Waiting for Next.js health endpoint ($i/90), HTTP status: $status"
            sleep 1
          done

          echo "TIMED OUT waiting for http://127.0.0.1:3100/api/v1/health after 90s" >&2
          echo "--- /tmp/next.log ---" >&2
          cat /tmp/next.log >&2 || true
          echo "--- /tmp/health-response ---" >&2
          cat /tmp/health-response 2>/dev/null || true
          exit 1
        env:
          SESSION_COOKIE_SECURE: "false"
          PORT: "3100"

      - name: Pre-warm Next.js surfaces (PERF-WEB-002)
        # The FIRST enrollment handoff on a freshly booted CI stack can stall
        # ~45s past the signin surface before the workspace lands: the setup
        # poll times out with the dashboard hydrating right at the budget, and
        # the retry 48s later completes in ~6s. Exercise the one-shot cost
        # (first-render of the workspace shell / warm-up of the BFF->identity
        # connection pool) OUTSIDE the test so the setup spec never races it.
        # curl cannot resolve *.localhost, so probe the Next server directly on
        # 127.0.0.1:3100 with the real Host headers (identical to what nginx
        # forwards). Sessionless 307s/302s are expected and still warm the
        # routes + middleware + BFF->identity calls.
        run: |
          for host in default.localhost default.signin.localhost; do
            for path in / /signin /setup-mfa; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" \
                -H "Host: $host" "http://127.0.0.1:3100$path" || true)
              echo "Pre-warmed http://$host$path -> $code"
            done
          done
        timeout-minutes: 5

      # ---- Playwright ------------------------------------------------------
      - name: Install Playwright browser
        run: pnpm --filter @skyrict/web exec playwright install --with-deps chromium

      - name: Run E2E tests
        # Explicit projects: the security suite must NEVER run on this (loose)
        # stack - it asserts on tightened rate-limit budgets. It has its own
        # phase below after the stack is replaced.
        # --workers=1 mirrors the security phase below: the spec files sign in
        # the SAME seeded admin, and identity rotates + revokes the refresh
        # family on reuse. Two parallel workers hydrating that one account race
        # the rotation chain and get bounced to /signin (or a revoked session).
        run: pnpm --filter @skyrict/web exec playwright test --project=setup --project=reports-smoke --project=crm-finance --project=perf --workers=1
        env:
          CI: "true"
          E2E_BASE_URL: "http://default.localhost:3000"
          E2E_SKIP_WEBSERVER: "1"
          SESSION_COOKIE_SECURE: "false"
          E2E_TENANT_SLUG: "default"
          E2E_ADMIN_EMAIL: "admin@skyrict.io"
          E2E_ADMIN_PASSWORD: "Admin123!"
          # True (1) only when BOTH embedding secrets are configured, so the
          # inventory spec asserts real hybrid results when the provider+key
          # are set together and the graceful exact-only degradation otherwise.
          # (A key without a provider stays disabled in ai-agent boot, so
          # gating on the pair keeps the assertion honest.)
          E2E_SEMANTIC_SEARCH: "${{ secrets.AI_EMBEDDING_PROVIDER != '' && secrets.AI_EMBEDDING_API_KEY != '' }}"

      - name: Capture main-phase stack diagnostics
        # PERF-WEB-002: the refresh-token chain and MFA handoff can fail fast
        # (identity rejecting TOTP codes, or a ~100ms-after-mint 303 bounce to
        # /signin?error=...) with NO Playwright trace (the failing attempt's
        # context files came back empty). The security phase below `down -v`s
        # this stack, so capture the evidence BEFORE it: identity/core logs,
        # the nginx stream (which IS the access log: /var/log/nginx/access.log
        # -> /dev/stdout), the Next.js log, and a Postgres dump of the auth
        # tables. audit_logs records AUTH_REFRESH_SUCCESS /
        # AUTH_REFRESH_REUSE_DETECTED / auth.login.mfa.verify_failed; sessions
        # holds the token-family hashes; handoff_tokens shows whether the
        # handoff redeem consumed its token - together they name the exact 303
        # branch (redeem-fail / refresh-fail / missing access_token) and the
        # TOTP rejection path.
        if: always()
        run: |
          set +e
          mkdir -p /tmp/e2e-main-diagnostics
          for svc in identity core ai-agent nginx postgres; do
            docker compose -f infra/docker/docker-compose.e2e.yml logs --no-color --timestamps "$svc" \
              > "/tmp/e2e-main-diagnostics/$svc.log" 2>&1
          done
          cp /tmp/next.log /tmp/e2e-main-diagnostics/next.log 2>/dev/null
          docker compose -f infra/docker/docker-compose.e2e.yml exec -T postgres sh -lc \
            'PGPASSWORD=skyrict pg_dump -U skyrict -d skyrict_identity --data-only --no-owner \
             --table=audit_logs --table=sessions --table=handoff_tokens --table=users' \
            > /tmp/e2e-main-diagnostics/auth-state.sql 2>&1
          du -sh /tmp/e2e-main-diagnostics/* 2>/dev/null
        timeout-minutes: 5

      - name: Upload main-phase diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-main-diagnostics
          path: /tmp/e2e-main-diagnostics/
          retention-days: 14

      # ---- Security phase (SKY-108) ---------------------------------------
      # Rebuilds the stack with tightened limits (docker-compose.e2e.security.yml)
      # and runs the security suite against it. The web app stays on :3100; only
      # the containers are swapped (down -v wipes the seeded data so the fresh
      # finance/probe accounts take the first-login path).
      - name: Boot tightened security stack
        run: |
          docker compose -f infra/docker/docker-compose.e2e.yml \
            -f infra/docker/docker-compose.e2e.security.yml down -v >/dev/null 2>&1 || true
          docker compose -f infra/docker/docker-compose.e2e.yml \
            -f infra/docker/docker-compose.e2e.security.yml up -d --build
        timeout-minutes: 15
        env:
          AI_EMBEDDING_PROVIDER: ${{ secrets.AI_EMBEDDING_PROVIDER }}
          AI_EMBEDDING_API_KEY: ${{ secrets.AI_EMBEDDING_API_KEY }}

      - name: Wait for identity and seed database (security)
        run: |
          for i in $(seq 1 60); do
            if docker compose -f infra/docker/docker-compose.e2e.yml \
              -f infra/docker/docker-compose.e2e.security.yml exec -T identity \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" \
              2>/dev/null; then
              break
            fi
            echo "Waiting for identity (security)... ($i/60)"
            sleep 2
          done

          docker compose -f infra/docker/docker-compose.e2e.yml \
            -f infra/docker/docker-compose.e2e.security.yml exec -T \
            --workdir /app/services/identity identity \
            python -m identity.seed
          echo "Seeded identity (security)"

          for i in $(seq 1 60); do
            if docker compose -f infra/docker/docker-compose.e2e.yml \
              -f infra/docker/docker-compose.e2e.security.yml exec -T core \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')" \
              2>/dev/null; then
              break
            fi
            echo "Waiting for core (security)... ($i/60)"
            sleep 2
          done

          docker compose -f infra/docker/docker-compose.e2e.yml \
            -f infra/docker/docker-compose.e2e.security.yml exec -T \
            --workdir /app/services/core core \
            python -m core.cli seed --tenant-id 00000000-0000-0000-0000-000000000001
          echo "Seeded core (security)"

          # The tightened stack boots a FRESH ai-agent (down -v wiped the
          # volumes, so it must re-run alembic + uvicorn). The rate-limiting
          # spec answers the AI inventory search BEFORE asserting the budget
          # exhausts: an agent that is still starting answers 503, which the
          # first expect(result.status).toBe(200) rejects. Wait for it like
          # identity/core above so the run lands on a ready agent.
          for i in $(seq 1 60); do
            if docker compose -f infra/docker/docker-compose.e2e.yml \
              -f infra/docker/docker-compose.e2e.security.yml exec -T ai-agent \
              python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')" \
              2>/dev/null; then
              break
            fi
            echo "Waiting for ai-agent (security)... ($i/60)"
            sleep 2
          done
        timeout-minutes: 10

      - name: Verify security configuration (identity grace window disabled)
        # The token-reuse spec asserts a rotated refresh token replay gets 401,
        # which only holds while the identity container actually runs with
        # IDENTITY_REFRESH_REUSE_GRACE_SECONDS=0. If the override ever stops
        # reaching the container (env-merge or service-rename regression), this
        # step fails with the real value instead of a confusing "Expected 401,
        # Received 200" deep inside the security suite.
        run: |
          value=$(docker compose -f infra/docker/docker-compose.e2e.yml \
            -f infra/docker/docker-compose.e2e.security.yml exec -T identity \
            sh -lc 'printf "%s" "$IDENTITY_REFRESH_REUSE_GRACE_SECONDS"')
          echo "IDENTITY_REFRESH_REUSE_GRACE_SECONDS=$value"
          if [ "$value" != "0" ]; then
            echo "::error::identity must run with IDENTITY_REFRESH_REUSE_GRACE_SECONDS=0, got '$value'" >&2
            exit 1
          fi
        timeout-minutes: 5

      - name: Run E2E security tests
        # --workers=1 keeps the whole suite on ONE authenticated session and
        # --retries=0 (project-level retries already 0) prevents a replay landing
        # inside a spent rate-limit window.
        run: pnpm --filter @skyrict/web exec playwright test --project=security --workers=1 --retries=0
        env:
          CI: "true"
          E2E_BASE_URL: "http://default.localhost:3000"
          E2E_SKIP_WEBSERVER: "1"
          SESSION_COOKIE_SECURE: "false"
          E2E_TENANT_SLUG: "default"
          E2E_ADMIN_EMAIL: "admin@skyrict.io"
          E2E_ADMIN_PASSWORD: "Admin123!"

      # ---- Artifacts -------------------------------------------------------
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Upload Playwright test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: apps/web/test-results/
          retention-days: 14

      # ---- Teardown --------------------------------------------------------
      - name: Teardown compose stack
        if: always()
        run: docker compose -f infra/docker/docker-compose.e2e.yml down -v --remove-orphans