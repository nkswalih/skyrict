# =============================================================================
# CI - Infrastructure
#
# Validates Terraform configuration, Kubernetes manifests, and the Azure
# Bicep templates on every PR that touches infra/. No cloud credentials or
# cluster access are required - the terraform steps init without a backend,
# kubeconform validates the rendered overlay against Kubernetes + CRD
# schemas offline, and the bicep job pins the v0.47.16 CLI to enforce
# formatting + a clean build/compile of every module in the dependency
# graph (main.bicep composes them all). Real validate/what-if for Azure
# runs in cd-azure-beta.yml with OIDC.
# =============================================================================

name: CI - Infrastructure

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "infra/terraform/**"
      - "infra/k8s/**"
      - "infra/azure/**"
      - ".github/workflows/ci-infra.yml"
  push:
    branches: [main, dev]
    paths:
      - "infra/terraform/**"
      - "infra/k8s/**"
      - "infra/azure/**"
      - ".github/workflows/ci-infra.yml"

concurrency:
  group: ci-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Format check
        run: terraform fmt -check -recursive infra/terraform/

      - name: Validate staging environment
        working-directory: infra/terraform/environments/staging
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Validate DNS module
        working-directory: infra/terraform/modules/dns/route53
        run: |
          terraform init -backend=false -input=false
          terraform validate

  kubernetes:
    name: Kubernetes manifests (build + schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render staging overlay
        run: kubectl kustomize infra/k8s/overlays/staging > /tmp/staging-rendered.yaml

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Validate rendered manifests
        # Certificate/ClusterIssuer are cert-manager CRDs with no entry in the
        # default kubeconform schema set; built-in kinds are still validated.
        run: kubeconform -summary -ignore-missing-schemas /tmp/staging-rendered.yaml

  bicep:
    name: Bicep (format + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Bicep CLI (v0.47.16)
        # /usr/local/bin is root-owned on the runner - a non-root step cannot
        # chmod there. $HOME/.local/bin is writable and already on PATH for
        # ubuntu images; exporting it via $GITHUB_PATH keeps it available to
        # the format/build steps that follow in this job.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL -o "$HOME/.local/bin/bicep" \
            https://github.com/Azure/bicep/releases/download/v0.47.16/bicep-linux-x64
          chmod +x "$HOME/.local/bin/bicep"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          bicep --version

      - name: Format check
        # `bicep format` has no --check flag; format to a temp file and diff
        # it against the committed file. The pinned CLI version makes this
        # reproducible in CI.
        run: |
          exit_code=0
          while IFS= read -r file; do
            tmp="$(mktemp)"
            bicep format --stdout "$file" > "$tmp"
            if ! diff -u "$file" "$tmp" > /dev/null; then
              echo "::error ::$file is not bicep-formatted. Run: bicep format $file"
              diff -u "$file" "$tmp" || true
              exit_code=1
            fi
          done < <(find infra/azure -name '*.bicep' -not -path '*/.*' | sort)
          exit $exit_code

      - name: Build + lint (compiles the whole module graph)
        # Info-level linter notes for intentionally pinned API versions are
        # allowed; any Error fails the build (exit code non-zero).
        run: bicep build infra/azure/main.bicep --stdout > /dev/null

      - name: Validate parameters file shape
        run: |
          jq -e '.parameters.postgresPassword.value == ""' infra/azure/parameters/beta.parameters.json > /dev/null
          jq -e '.parameters.deployWorkloads.value == false' infra/azure/parameters/beta.parameters.json > /dev/null

      - name: Guard CD deployment outputs against main.bicep
        # cd-azure-beta.yml reads deployment outputs as `jq -r '.X.value'`
        # against the JSON that the top-level `az deployment group create`
        # prints. Bicep does not forward module outputs, so main.bicep has to
        # re-export every one of them by hand.
        #
        # Forgetting one is not a compile error and not a runtime error at
        # the call site either: jq prints the string "null" for an absent key
        # and exits 0, so the value is written to GITHUB_OUTPUT and consumed
        # verbatim. The symptom is `curl https://null/api/v1/health` and
        # `az containerapp show --name null` in the final job, after
        # provision-infra, build-push-images and deploy-workloads have all
        # reported success - a complete rollout that cannot verify itself,
        # discovered by reading logs rather than by a red build.
        #
        # The Preflight step also greps `.value`, but off the *parameters*
        # file rather than a deployment output, so `.parameters.` reads are
        # excluded by shape instead of by an exemption list. A hardcoded
        # allowlist is this same failure mode with an extra maintenance
        # burden, and it would silently rot the first time a parameter was
        # added to the Preflight step. Note the dotted path is matched in
        # full - `grep -o` anchors on the last dot, so a pattern of
        # `\.[A-Za-z_]*\.value` extracts `.apiHostname.value` out of
        # `.parameters.apiHostname.value` and the filter misses it.
        run: |
          set -euo pipefail
          workflow=".github/workflows/cd-azure-beta.yml"

          mapfile -t consumed < <(
            grep -oE '\.[A-Za-z_][A-Za-z0-9_.]*\.value' "$workflow" \
              | grep -v '\.parameters\.' \
              | sed -E 's/^\.//; s/\.value$//' \
              | sort -u
          )
          mapfile -t declared < <(
            grep -oE '^output [A-Za-z_][A-Za-z0-9_]*' infra/azure/main.bicep \
              | awk '{print $2}' \
              | sort -u
          )

          # Fail closed on an empty read set. Zero extracted outputs means the
          # pattern stopped matching the workflow - a renamed key, a different
          # jq invocation - not that the CD reads nothing it must declare.
          # Without this the step reports OK having checked nothing, which is
          # the one failure mode a guard must never have: it reads as evidence
          # that the contract holds. Note the pipeline is inside a process
          # substitution, so a no-match grep exits non-zero without tripping
          # `set -e` in the parent, and that silence is exactly what this
          # check exists to catch.
          if [ "${#consumed[@]}" -eq 0 ]; then
            echo "::error::extracted zero deployment-output reads from $workflow - the guard is not matching. Fix the pattern before trusting any pass from it."
            exit 1
          fi

          missing=()
          for key in "${consumed[@]}"; do
            printf '%s\n' "${declared[@]}" | grep -qx "$key" || missing+=("$key")
          done

          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::cd-azure-beta.yml consumes deployment outputs main.bicep does not declare: ${missing[*]}"
            echo "Bicep does not forward module outputs. Add each as \`output <name> string = apps.outputs.<name>\` in main.bicep, or stop reading it in the workflow."
            exit 1
          fi
          echo "CD output contract OK - ${#consumed[@]} deployment output(s) consumed, all declared by main.bicep."
