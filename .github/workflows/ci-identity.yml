name: CI - Identity Service

on:
  push:
    branches: [main, dev]
    paths:
      - "services/identity/**"
      - "!services/identity/Dockerfile"
      - "!services/identity/Dockerfile.dev"
      - "libs/skyrict-common/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "services/identity/**"
      - "!services/identity/Dockerfile"
      - "!services/identity/Dockerfile.dev"
      - "libs/skyrict-common/**"

concurrency:
  group: ci-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff check
        run: uv run ruff check services/ libs/

      - name: Ruff format check
        run: uv run ruff format --check services/ libs/

      - name: Mypy
        run: uv run mypy services/identity/src/

      - name: Import Linter
        run: uv run lint-imports --config services/identity/import-linter.toml

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run unit tests
        run: uv run pytest services/identity/tests/unit/ -v --tb=short

  test-integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skyrict
          POSTGRES_PASSWORD: skyrict
          POSTGRES_DB: skyrict_identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyrict -d skyrict_identity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      IDENTITY_DATABASE_URL: postgresql+asyncpg://skyrict:skyrict@localhost:5432/skyrict_identity
      IDENTITY_REDIS_URL: redis://localhost:6379/0
      IDENTITY_ENVIRONMENT: test
      IDENTITY_JWKS_ISSUER: https://auth.test.skyrict.io
      IDENTITY_JWKS_AUDIENCE: api.test.skyrict.io
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Generate ephemeral JWT key pair
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import rsa

          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          keys = Path(".dev/keys")
          keys.mkdir(parents=True, exist_ok=True)
          (keys / "private.pem").write_bytes(
              key.private_bytes(
                  encoding=serialization.Encoding.PEM,
                  format=serialization.PrivateFormat.PKCS8,
                  encryption_algorithm=serialization.NoEncryption(),
              )
          )
          (keys / "public.pem").write_bytes(
              key.public_key().public_bytes(
                  encoding=serialization.Encoding.PEM,
                  format=serialization.PublicFormat.SubjectPublicKeyInfo,
              )
          )
          PY

      - name: Run identity API integration tests
        env:
          IDENTITY_JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/.dev/keys/private.pem
          IDENTITY_JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/.dev/keys/public.pem
        run: |
          export IDENTITY_MFA_ENCRYPTION_KEY="$(
            uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
          )"
          # This list is a real coverage gap, not a convention. The only CI job
          # with a database for identity is this one, and it named two files, so
          # every other file under integration/api/ has never run here - and
          # `ci.yml`'s DB-less `Tests (services/identity)` job skips them all
          # with "database unavailable", so they look covered from the outside.
          # Prefer the whole directory and fix whatever it surfaces; until
          # then, add files here deliberately rather than trusting a new test
          # to have run.
          uv run pytest \
            services/identity/tests/integration/api/test_seed_rbac.py \
            services/identity/tests/integration/api/test_seed_vastraline_rbac.py \
            services/identity/tests/integration/api/test_session_lifecycle.py \
            -v --tb=short

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and verify
        run: |
          uv sync --all-packages
          uv run python -c "import identity; print(identity.__version__)"
