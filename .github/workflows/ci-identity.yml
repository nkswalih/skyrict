name: CI - Identity Service

on:
  push:
    branches: [main, dev]
    paths:
      - "services/identity/**"
      - "!services/identity/Dockerfile"
      - "!services/identity/Dockerfile.dev"
      - "libs/skyrict-common/**"
  pull_request:
    branches: [main, dev]
    paths:
      - "services/identity/**"
      - "!services/identity/Dockerfile"
      - "!services/identity/Dockerfile.dev"
      - "libs/skyrict-common/**"

concurrency:
  group: ci-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Ruff check
        run: uv run ruff check services/ libs/

      - name: Ruff format check
        run: uv run ruff format --check services/ libs/

      - name: Mypy
        run: uv run mypy services/identity/src/

      - name: Import Linter
        run: uv run lint-imports

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Run unit tests
        run: uv run pytest services/identity/tests/unit/ -v --tb=short

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install and verify
        run: |
          uv sync --all-packages
          uv run python -c "import identity; print(identity.__version__)"
