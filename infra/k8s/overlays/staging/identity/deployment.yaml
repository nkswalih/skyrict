apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: skyrict-staging
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: skyrict
    app.kubernetes.io/component: auth
    environment: staging
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: skyrict
        environment: staging
    spec:
      serviceAccountName: identity
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: identity
          image: skyrict/identity:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: ENVIRONMENT
              value: staging
            - name: DEBUG
              value: "false"
            - name: LOG_LEVEL
              value: INFO
            - name: LOG_JSON
              value: "true"
          envFrom:
            - secretRef:
                name: identity-secrets-staging
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: skyrict-registry
