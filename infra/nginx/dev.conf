# =============================================================================
# Skyrict - local multi-tenant routing (DEV ONLY)
#
# Routes local requests to the appropriate backend and injects the
# X-Tenant-Slug header so tenant resolution behaves identically to
# production, where a request arrives at https://acme.skyrict.in/... and
# the ingress derives the tenant slug from the subdomain.
#
# Two local entry points:
#   1. Subdomain route (primary)      http://acme.localhost/...
#      -> Next.js web app (host:3000) for pages
#      -> Identity service for /api/* calls with X-Tenant-Slug: acme
#   2. Path fallback (no wildcard DNS) http://localhost/acme/...
#      -> Next.js web app (host:3000) for pages
#      -> Identity service for /api/* calls with X-Tenant-Slug: acme
#
# The client-supplied X-Tenant-Slug header (if any) is always overwritten -
# the slug is derived from the subdomain / path, never trusted from input.
#
# Mounted read-only at /etc/nginx/conf.d/default.conf by the `nginx` service
# in infra/docker/docker-compose.dev.yml.
# =============================================================================

# Access log that shows the tenant context so `docker logs skyrict-nginx`
# makes per-subdomain routing visible.
log_format skyrict_dev '$remote_addr - $host "$request" $status '
                       'tenant_slug="$tenant_slug"';

# Re-resolve compose service names on every request instead of caching the
# container IP at startup. Docker's embedded DNS (127.0.0.11) answers with a
# short TTL, and a variable in proxy_pass forces nginx to honour it. Without
# this, recreating a backend container (new IP) leaves nginx proxying to a
# dead address -> 502 -> the healthcheck flips the proxy unhealthy.
resolver 127.0.0.11 valid=10s;

# ---------------------------------------------------------------------------
# 1) Subdomain route: *.localhost
#    Mirrors production tenant subdomains (acme.skyrict.in). The first
#    label is captured and forwarded as X-Tenant-Slug.
#    - /api/* requests → identity backend (injected X-Tenant-Slug)
#    - All other requests → Next.js web app on host (handles UI + BFF)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name ~^(?<tenant_slug>[a-z0-9-]+)\.localhost$;

    access_log /dev/stdout skyrict_dev;

    # API calls go to the identity backend with tenant context.
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;

        # Variable + resolver above: re-resolve identity's IP per request so
        # backend recreations (new container IP) don't strand the proxy.
        set $identity_upstream http://identity:8000;
        proxy_pass $identity_upstream;
    }

    # Everything else (pages, assets, _next/*) → Next.js on the host machine.
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;

        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ---------------------------------------------------------------------------
# 2) Path fallback: localhost/{tenant_slug}/...
#    For environments where wildcard *.localhost is unavailable.
#    - /{tenant}/login → identity auth API directly
#    - /api/* requests → identity backend
#    - Everything else → Next.js web app on host
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name localhost;

    access_log /dev/stdout skyrict_dev;

    # /{tenant}/login maps to the identity login API directly.
    location ~ ^/(?!api/|docs/|redoc/)(?<tenant_slug>[a-z0-9-]+)/login$ {
        access_log /dev/stdout skyrict_dev;

        rewrite ^ /api/v1/auth/login break;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Slug $tenant_slug;

        # Variable + resolver (see http block): re-resolve identity per request.
        set $identity_upstream http://identity:8000;
        proxy_pass $identity_upstream;
    }

    # API calls → identity backend.
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        set $identity_upstream http://identity:8000;
        proxy_pass $identity_upstream;
    }

    # Everything else → Next.js on host.
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://host.docker.internal:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
